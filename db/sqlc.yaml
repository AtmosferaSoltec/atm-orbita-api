# sqlc genera código Go tipado a partir de SQL real. Una entrada por módulo, que
# genera dentro del propio módulo. El esquema son las migraciones de goose.
#
# En Windows sqlc necesita cgo; se corre con su imagen de Docker:
#   docker run --rm -v "${PWD}:/src" -w /src sqlc/sqlc generate -f db/sqlc.yaml
version: "2"

overrides:
  go:
    overrides:
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
      - db_type: uuid
        nullable: true
        go_type:
          import: github.com/google/uuid
          type: UUID
          pointer: true
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          import: time
          type: Time
          pointer: true

sql:
  - engine: postgresql
    schema: migrations
    queries: ../internal/modules/identity/adapters/postgres/queries.sql
    gen:
      go:
        package: sqlcgen
        out: ../internal/modules/identity/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
