# sqlc genera código Go tipado a partir de SQL real. Una entrada por módulo, que
# genera dentro del propio módulo. Cada entrada lee solo las migraciones de su
# módulo: así cada uno genera los modelos de sus tablas y nada más.
#
# En Windows sqlc necesita cgo; se corre con su imagen de Docker:
#   docker run --rm -v "${PWD}:/src" -w /src sqlc/sqlc generate -f db/sqlc.yaml
version: "2"

overrides:
  go:
    overrides:
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
      - db_type: uuid
        nullable: true
        go_type:
          import: github.com/google/uuid
          type: UUID
          pointer: true
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          import: time
          type: Time
          pointer: true
      # DATE: medianoche UTC en un time.Time (dates.LocalDate.Time / dates.FromTime).
      - db_type: date
        go_type: time.Time
      # Dinero y tipos de cambio: decimal exacto (pgx-shopspring-decimal), nunca float.
      - db_type: pg_catalog.numeric
        go_type: github.com/shopspring/decimal.Decimal
      - db_type: pg_catalog.numeric
        nullable: true
        go_type: github.com/shopspring/decimal.NullDecimal

sql:
  - engine: postgresql
    schema:
      - migrations/00001_identity_create_users_and_sessions.sql
    queries: ../internal/modules/identity/adapters/postgres/queries.sql
    gen:
      go:
        package: sqlcgen
        out: ../internal/modules/identity/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
  - engine: postgresql
    schema:
      - migrations/00002_profile_create_profiles_and_exchange_rates.sql
    queries: ../internal/modules/profile/adapters/postgres/queries.sql
    gen:
      go:
        package: sqlcgen
        out: ../internal/modules/profile/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
  - engine: postgresql
    schema:
      - migrations/00003_ledger_create_categories.sql
      - migrations/00004_ledger_create_accounts.sql
      - migrations/00005_ledger_create_transactions.sql
      - migrations/00006_ledger_create_transfers.sql
      - migrations/00008_ledger_add_transaction_source.sql
    queries:
      - ../internal/modules/ledger/adapters/postgres/categories.sql
      - ../internal/modules/ledger/adapters/postgres/accounts.sql
      - ../internal/modules/ledger/adapters/postgres/transactions.sql
      - ../internal/modules/ledger/adapters/postgres/transfers.sql
    gen:
      go:
        package: sqlcgen
        out: ../internal/modules/ledger/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
  - engine: postgresql
    schema:
      - migrations/00007_credit_create_cards_and_purchases.sql
      - migrations/00009_credit_add_purchase_payment.sql
    queries:
      - ../internal/modules/credit/adapters/postgres/queries.sql
    gen:
      go:
        package: sqlcgen
        out: ../internal/modules/credit/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
