openapi: 3.1.0
info:
  title: Orbita API
  version: 0.1.0
  description: |
    Backend de la app Orbita (Android). Contrato según AGENT_GUIDE.md §4:
    JSON en snake_case, éxito en `{ "data": ... }`, listas paginadas con
    `meta`, errores en `{ "error": { "code", "message", "details" } }`.
    El dinero viaja como texto ("1245.80"), nunca como número.
    Se actualiza en el mismo cambio que cada plan de docs/plans/.
servers:
  - url: https://orbita-api.atmosferast.com/api/v1
    description: Producción
  - url: http://localhost:3001/api/v1
    description: Desarrollo local

paths:
  /health:
    get:
      summary: El proceso responde (liveness)
      description: La usa el healthcheck de Docker. No consulta la base.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, example: ok }
  /health/ready:
    get:
      summary: El API y su base responden (readiness)
      operationId: getHealthReady
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, example: ok }
                      database: { type: string, example: ok }
        "503":
          description: La base no responde
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /auth/register:
    post:
      summary: Crear una cuenta (y su primera sesión)
      description: |
        En una sola transacción crea la cuenta, la sesión y todo lo del alta
        (perfil, categorías y cuenta "Efectivo" llegan con los planes 02 a 04).
        Límite por IP: LOGIN_RATE_LIMIT_PER_MINUTE.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 128 }
                main_currency: { type: string, description: "Del catálogo; por defecto PEN", example: PEN }
                timezone: { type: string, description: "Zona IANA; inválida o ausente = America/Lima", example: America/Lima }
      responses:
        "201":
          description: Cuenta creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409":
          description: "EMAIL_ALREADY_REGISTERED"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/login:
    post:
      summary: Iniciar sesión
      description: Correo inexistente y contraseña equivocada dan la misma respuesta. Tras 5 fallos seguidos con un correo, espera de 1, 5 y 15 minutos.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Sesión abierta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: "INVALID_CREDENTIALS"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/refresh:
    post:
      summary: Renovar el access token (rota el refresh token)
      description: Reusar un refresh token ya usado revoca toda la sesión. La app debe renovar de a una petición a la vez.
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Tokens nuevos
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [tokens]
                    properties:
                      tokens: { $ref: "#/components/schemas/Tokens" }
        "401":
          description: "SESSION_EXPIRED: hay que iniciar sesión de nuevo"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/logout:
    post:
      summary: Cerrar la sesión de este dispositivo
      description: Siempre 204, aunque el token no exista.
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: Sesión cerrada }
  /me:
    get:
      summary: La cuenta de quien hace la petición
      operationId: getMe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "401":
          description: "UNAUTHORIZED"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /currencies:
    get:
      summary: Monedas que la app permite elegir
      operationId: getCurrencies
      security: []
      responses:
        "200":
          description: Catálogo (cacheable un día)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [code, symbol, name]
                      properties:
                        code: { type: string, example: PEN }
                        symbol: { type: string, example: "S/" }
                        name: { type: string, example: Soles }
  /settings:
    get:
      summary: Preferencias del usuario (monedas, zona horaria, tipo de cambio)
      operationId: getSettings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      summary: Cambiar la moneda de visualización o la zona horaria
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_currency: { type: string, description: "Una de las dos del par" }
                timezone: { type: string, description: "Zona IANA" }
      responses:
        "200":
          description: Ajustes actualizados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "422":
          description: "FX_RATE_NOT_CONFIGURED: ver el ahorro en la secundaria sin tipo de cambio"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /settings/fx:
    put:
      summary: Guardar el par de monedas y su tipo de cambio (juntos)
      description: Nunca se guarda un par sin un tipo de cambio mayor que cero. Cada valor es una fila nueva del historial.
      operationId: setFx
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [main_currency, secondary_currency, rate]
              properties:
                main_currency: { type: string, example: PEN }
                secondary_currency: { type: string, example: USD }
                rate: { $ref: "#/components/schemas/Rate" }
      responses:
        "200":
          description: Ajustes con el tipo de cambio nuevo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }

  /categories:
    get:
      summary: Categorías no archivadas, en el orden en que se crearon
      operationId: listCategories
      responses:
        "200":
          description: Las 9 iniciales primero, luego las del usuario
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Crear una categoría
      description: |
        Si viene `id` y ya existe una categoría propia con ese id y el mismo contenido,
        responde 200 con ella (reintento). Con otro contenido, 409 ID_CONFLICT.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, color]
              properties:
                id: { type: string, format: uuid }
                name: { type: string, maxLength: 60, example: Mascotas }
                kind: { type: string, enum: [income, expense] }
                color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: "#0E7490" }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryResponse" }
        "200":
          description: Reintento idéntico; la categoría ya existía
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/CategoryConflict" }

  /categories/{id}:
    patch:
      summary: Renombrar o cambiar el color (el tipo no cambia)
      operationId: updateCategory
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60 }
                color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
      responses:
        "200":
          description: Categoría actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CategoryConflict" }

  /categories/{id}/archive:
    post:
      summary: Archivar una categoría
      description: Deja de listarse y libera su nombre; los movimientos anteriores la conservan. Archivar una ya archivada responde 204.
      operationId: archiveCategory
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Archivada }
        "404": { $ref: "#/components/responses/NotFound" }

  /accounts:
    get:
      summary: Cuentas no archivadas con su saldo, y el ahorro total
      operationId: listAccounts
      responses:
        "200":
          description: En su orden (la primera es la cuenta por defecto)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [accounts, savings]
                    properties:
                      accounts:
                        type: array
                        items: { $ref: "#/components/schemas/Account" }
                      savings: { $ref: "#/components/schemas/Savings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Crear una cuenta
      description: |
        Sin tipo de cambio, solo en la moneda principal (si no, 422 FX_RATE_NOT_CONFIGURED).
        Con `id` ya usado y el mismo contenido responde 200 (reintento); con otro, 409 ID_CONFLICT.
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, currency]
              properties:
                id: { type: string, format: uuid }
                name: { type: string, maxLength: 60, example: Cuenta Dólares }
                type: { type: string, enum: [cash, debit, savings, other] }
                currency: { type: string, example: USD }
                initial_balance:
                  allOf: [{ $ref: "#/components/schemas/Money" }]
                  description: Por defecto "0.00"; nunca negativo. No cambia después.
                include_in_savings: { type: boolean, default: true }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResponse" }
        "200":
          description: Reintento idéntico; la cuenta ya existía
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "409": { $ref: "#/components/responses/IdConflict" }
        "422": { $ref: "#/components/responses/FxNotConfigured" }

  /accounts/{id}:
    patch:
      summary: Cambiar nombre, tipo o si cuenta en el ahorro
      description: La moneda y el saldo inicial no cambian; enviarlos responde 400 FIELD_NOT_EDITABLE.
      operationId: updateAccount
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60 }
                type: { type: string, enum: [cash, debit, savings, other] }
                include_in_savings: { type: boolean }
      responses:
        "200":
          description: Cuenta actualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResponse" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "404": { $ref: "#/components/responses/NotFound" }

  /accounts/{id}/archive:
    post:
      summary: Archivar una cuenta
      description: Deja de listarse y de sumar al ahorro; sus movimientos se conservan. Archivar una ya archivada responde 204.
      operationId: archiveAccount
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Archivada }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  responses:
    IdConflict:
      description: ID_CONFLICT (id ya usado con otro contenido)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    FxNotConfigured:
      description: FX_RATE_NOT_CONFIGURED (otra moneda sin tipo de cambio)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: NOT_FOUND (no existe o es de otro usuario)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    CategoryConflict:
      description: |
        CATEGORY_NAME_TAKEN (nombre repetido en ese tipo, sin distinguir mayúsculas ni
        tildes; details trae name / NAME_TAKEN) o ID_CONFLICT (id ya usado con otro contenido)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: UNAUTHORIZED
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationFailed:
      description: VALIDATION_FAILED, con los campos en details
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TooManyRequests:
      description: TOO_MANY_REQUESTS, con la cabecera Retry-After (segundos)
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required: [id, email, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        created_at: { type: string, format: date-time }
    Tokens:
      type: object
      required: [access_token, access_token_expires_in, refresh_token]
      properties:
        access_token: { type: string, description: "JWT HS256; va en Authorization: Bearer" }
        access_token_expires_in: { type: integer, description: Segundos, example: 900 }
        refresh_token: { type: string, description: "Opaco; guardarlo cifrado en el dispositivo" }
    AuthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, tokens]
          properties:
            user: { $ref: "#/components/schemas/User" }
            tokens: { $ref: "#/components/schemas/Tokens" }
    SettingsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [main_currency, secondary_currency, display_currency, timezone, fx_mode, fx_configured, rate, rate_updated_at]
          properties:
            main_currency: { type: string }
            secondary_currency: { type: string }
            display_currency: { type: string }
            timezone: { type: string }
            fx_mode: { type: string, enum: [manual, auto] }
            fx_configured: { type: boolean }
            rate:
              description: Unidades de la principal por 1 de la secundaria; null sin tipo de cambio
              oneOf:
                - { $ref: "#/components/schemas/Rate" }
                - { type: "null" }
            rate_updated_at: { type: [string, "null"], format: date-time }
    Category:
      type: object
      required: [id, name, kind, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Alimentación }
        kind: { type: string, enum: [income, expense] }
        color: { type: string, example: "#0E7490" }
    CategoryResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Category" }
    Account:
      type: object
      required: [id, name, type, currency, balance, include_in_savings]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Cuenta Dólares }
        type: { type: string, enum: [cash, debit, savings, other] }
        currency: { type: string, example: USD }
        balance:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Calculado (saldo inicial + ingresos − egresos + transferencias); nunca se guarda
        include_in_savings: { type: boolean }
    AccountResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Account" }
    Savings:
      type: object
      required: [included_count, active_count, totals]
      properties:
        included_count: { type: integer, description: Cuentas activas que cuentan en el ahorro }
        active_count: { type: integer }
        totals:
          type: array
          description: La principal primero; la secundaria solo si hay tipo de cambio. Redondeo una sola vez, al final.
          items:
            type: object
            required: [currency, amount]
            properties:
              currency: { type: string }
              amount: { $ref: "#/components/schemas/Money" }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    Money:
      type: string
      pattern: '^\d{1,12}(\.\d{1,2})?$'
      description: Monto como texto, con punto decimal y hasta 2 decimales. Las respuestas siempre traen 2.
      example: "1245.80"
    Rate:
      type: string
      pattern: '^\d{1,12}(\.\d{1,6})?$'
      description: Tipo de cambio como texto, hasta 6 decimales.
      example: "3.200000"
    LocalDate:
      type: string
      format: date
      description: Día del calendario, sin hora ni zona.
      example: "2026-10-02"
    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string, example: amount }
        code:
          type: string
          description: Código del enum ValidationError de Android, en su orden de revisión.
          example: AMOUNT_REQUIRED
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Estable, en inglés. Comunes: VALIDATION_FAILED, UNAUTHORIZED, NOT_FOUND,
                METHOD_NOT_ALLOWED, CONFLICT, ID_CONFLICT, PAYLOAD_TOO_LARGE,
                TOO_MANY_REQUESTS, INTERNAL_ERROR, DATABASE_UNAVAILABLE.
              example: VALIDATION_FAILED
            message:
              type: string
              description: En español, solo como respaldo; la app elige su texto por el code.
              example: Revisa los datos enviados.
            details:
              description: En VALIDATION_FAILED, la lista de campos con problema.
              type: array
              items: { $ref: "#/components/schemas/FieldError" }

security:
  - bearer: []
